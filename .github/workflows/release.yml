name: Release VSIX

# Builds, tests, packages, and attaches the VSIX to a GitHub Release on v* tags.
# Visual Studio Marketplace publishing is handled via OIDC Trusted Publishing in
# ToTt0G/vscode-marketplace-publisher (.github/workflows/publish.yml).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: winforms-designer-extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: winforms-designer-extension/package-lock.json

      - name: Verify git tag matches package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build, and run unit tests
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: winforms-designer-extension/*.vsix

      - name: Publish to Open VSX (when OVSX_PAT secret is configured)
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT not configured; skipping Open VSX publish."
            exit 0
          fi
          VSIX_FILE="$(ls -1 *.vsix | head -n 1)"
          npx --yes ovsx@1.4.0 publish "$VSIX_FILE" -p "$OVSX_PAT"
