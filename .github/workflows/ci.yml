name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: winforms-designer-extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: winforms-designer-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build, and run unit tests
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: winforms-designer-modern-vsix
          path: winforms-designer-extension/*.vsix

  windows-winforms-compile-check:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: winforms-designer-extension/package-lock.json

      - name: Install extension dependencies and build
        working-directory: winforms-designer-extension
        run: |
          npm ci
          npm test

      - name: Build sample WinForms projects on Windows
        run: |
          dotnet build TestDesignFile/TestDesignFile.csproj --configuration Release
          dotnet build samples/OrderManagerDemo/OrderManagerDemo.csproj --configuration Release
