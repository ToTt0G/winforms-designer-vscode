<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <title>WinForms Designer for VS Code</title>
  <defs>
    <radialGradient id="tile" cx="96" cy="84" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B182E"/>
      <stop offset="0.6" stop-color="#081325"/>
      <stop offset="1" stop-color="#060D1A"/>
    </radialGradient>
    <linearGradient id="rim" x1="6" y1="6" x2="250" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#1F9CF0"/>
      <stop offset="1" stop-color="#0065A9"/>
    </linearGradient>
    <radialGradient id="halo" cx="92" cy="94" r="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F9CF0" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#007ACC" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#007ACC" stop-opacity="0"/>
    </radialGradient>
    <!-- VS Code ribbon (100x100 design space) -->
    <linearGradient id="panel" x1="70" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#1F9CF0"/>
      <stop offset="1" stop-color="#168BE0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="armShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="2.1" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="panelShadow" x="-60%" y="-20%" width="220%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="-2" dy="0" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <!-- Form window -->
    <linearGradient id="titlebar" x1="112" y1="0" x2="228" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#1F9CF0"/>
    </linearGradient>
    <linearGradient id="formBody" x1="0" y1="118" x2="0" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13243F"/>
      <stop offset="1" stop-color="#0C1830"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="182" x2="0" y2="202" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="formShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#00040C" flood-opacity="0.85"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rimGlow" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <clipPath id="tileClip"><rect x="6" y="6" width="244" height="244" rx="48"/></clipPath>
    <clipPath id="formClip"><rect x="112" y="118" width="116" height="96" rx="10"/></clipPath>
  </defs>

  <!-- Squircle container -->
  <rect x="6" y="6" width="244" height="244" rx="48" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <circle cx="92" cy="94" r="104" fill="url(#halo)"/>
  </g>
  <rect x="7" y="7" width="242" height="242" rx="47" stroke="url(#rim)" stroke-width="2" opacity="0.55" filter="url(#rimGlow)"/>
  <rect x="6.75" y="6.75" width="242.5" height="242.5" rx="47.25" stroke="url(#rim)" stroke-width="1.5" opacity="0.7"/>

  <!-- Back layer: VS Code ribbon -->
  <g transform="translate(26 30) scale(1.3)">
    <path d="M96.4614 10.7962L75.8569 0.875542C73.4719 -0.272773 70.6217 0.211611 68.75 2.08333L1.29858 63.5832C-0.515693 65.2373 -0.513607 68.0937 1.30308 69.7452L6.81272 74.754C8.29793 76.1042 10.5347 76.2036 12.1338 74.9905L93.3609 13.3699C96.0859 11.3026 100 13.2462 100 16.6667V16.4275C100 14.0265 98.6246 11.8378 96.4614 10.7962Z" fill="#0065A9"/>
    <g filter="url(#armShadow)">
      <path d="M96.4614 89.2038L75.8569 99.1245C73.4719 100.273 70.6217 99.7884 68.75 97.9167L1.29858 36.4169C-0.515693 34.7627 -0.513607 31.9063 1.30308 30.2548L6.81272 25.246C8.29793 23.8958 10.5347 23.7964 12.1338 25.0095L93.3609 86.6301C96.0859 88.6974 100 86.7538 100 83.3334V83.5726C100 85.9735 98.6246 88.1622 96.4614 89.2038Z" fill="#007ACC"/>
    </g>
    <g filter="url(#panelShadow)">
      <path d="M75.8578 99.1263C73.4721 100.274 70.6219 99.7885 68.75 97.9166C71.0564 100.223 75 98.5895 75 95.3278V4.67213C75 1.41039 71.0564 -0.223106 68.75 2.08329C70.6219 0.211402 73.4721 -0.273666 75.8578 0.873633L96.4587 10.7807C98.6234 11.8217 100 14.0112 100 16.4132V83.5871C100 85.9891 98.6234 88.1786 96.4586 89.2196L75.8578 99.1263Z" fill="url(#panel)"/>
    </g>
    <path d="M70.9119 99.3171C72.4869 99.9307 74.2828 99.8914 75.8725 99.1264L96.4608 89.2197C98.6242 88.1787 100 85.9892 100 83.5872V16.4133C100 14.0113 98.6243 11.8218 96.4609 10.7808L75.8725 0.873756C73.7862 -0.130129 71.3446 0.11576 69.5135 1.44695C69.252 1.63711 69.0028 1.84943 68.769 2.08341L29.3551 38.0415L12.1872 25.0096C10.589 23.7965 8.35363 23.8959 6.86933 25.2461L1.36303 30.2549C-0.452552 31.9064 -0.454633 34.7627 1.35853 36.417L16.2471 50.0001L1.35853 63.5832C-0.454633 65.2374 -0.452552 68.0938 1.36303 69.7453L6.86933 74.7541C8.35363 76.1043 10.589 76.2037 12.1872 74.9905L29.3551 61.9587L68.769 97.9167C69.3925 98.5406 70.1246 99.0104 70.9119 99.3171ZM75.0152 27.2989L45.1091 50.0001L75.0152 72.7012V27.2989Z" fill="url(#sheen)" style="mix-blend-mode:overlay"/>
  </g>

  <!-- Front layer: WinForms form being designed -->
  <rect x="106" y="112" width="128" height="108" rx="15" fill="#060D1A"/>
  <g filter="url(#formShadow)">
    <rect x="112" y="118" width="116" height="96" rx="10" fill="url(#formBody)"/>
  </g>
  <g clip-path="url(#formClip)">
    <rect x="112" y="118" width="116" height="21" fill="url(#titlebar)"/>
    <rect x="112" y="118" width="116" height="1.5" fill="#FFFFFF" opacity="0.35"/>
    <!-- app glyph + title -->
    <rect x="119" y="124" width="9" height="9" rx="2" fill="#FFFFFF" opacity="0.95"/>
    <rect x="132" y="127" width="26" height="3.5" rx="1.75" fill="#FFFFFF" opacity="0.7"/>
    <!-- – □ × -->
    <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
      <path d="M182 131H189"/>
      <rect x="196" y="125" width="7" height="7" rx="1" fill="none" stroke-width="1.8"/>
      <path d="M211 125L218 132M218 125L211 132"/>
    </g>
  </g>
  <rect x="112.5" y="118.5" width="115" height="95" rx="9.5" stroke="#38BDF8" stroke-opacity="0.55"/>

  <!-- Checkbox row -->
  <rect x="122" y="146" width="11" height="11" rx="2.5" fill="#1F9CF0"/>
  <path d="M124.6 151.6L127 154L130.6 149.4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="138" y="149.5" width="34" height="4" rx="2" fill="#7FA6CF" opacity="0.75"/>
  <!-- TextBox row -->
  <rect x="122.5" y="163.5" width="94" height="12" rx="3" fill="#081325" stroke="#2C6CB0"/>
  <rect x="127" y="168" width="22" height="3" rx="1.5" fill="#7FA6CF" opacity="0.6"/>

  <!-- Snaplines -->
  <g filter="url(#softGlow)">
    <path d="M122 142V210" stroke="#22D3EE" stroke-width="1.6"/>
    <path d="M116 192H224" stroke="#FBBF24" stroke-width="1.4" stroke-dasharray="3 2.5"/>
  </g>

  <!-- Selected Button -->
  <rect x="122" y="183" width="60" height="19" rx="4" fill="url(#amber)"/>
  <rect x="130" y="190.5" width="30" height="4" rx="2" fill="#4A2A00" opacity="0.75"/>
  <rect x="119.5" y="180.5" width="65" height="24" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 2" opacity="0.85"/>
  <g fill="#FFFFFF" stroke="#0065A9" stroke-width="1">
    <rect x="116.5" y="177.5" width="6" height="6"/>
    <rect x="181.5" y="177.5" width="6" height="6"/>
    <rect x="116.5" y="201.5" width="6" height="6"/>
    <rect x="181.5" y="201.5" width="6" height="6"/>
    <rect x="149" y="177.5" width="6" height="6"/>
    <rect x="149" y="201.5" width="6" height="6"/>
  </g>

  <!-- Drag cursor -->
  <g transform="translate(172 188)">
    <path d="M0 0V27L7 20.5L11.5 31L16 29L11.5 18.8H21Z" fill="#FFFFFF" stroke="#060D1A" stroke-width="2.4" stroke-linejoin="round"/>
  </g>
</svg>
